<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snapshot Capture</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #1e293b;
      border-radius: 16px;
      padding: 1.5rem;
      border: 1px solid #334155;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    h2 { font-size: 1.25rem; margin-bottom: 0.5rem; }
    p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 1.2rem; }
    .preview-box {
      width: 100%;
      aspect-ratio: 3/4;
      background: #0f172a;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #334155;
      position: relative;
    }
    video, img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .action-btn {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .action-btn:active { background: #1d4ed8; }
    .status-badge {
      position: absolute;
      bottom: 10px;
      background: rgba(15, 23, 42, 0.85);
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
    }
    canvas { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Camera Capture</h2>
    <p id="subText">Tap below to grant access and take a snapshot</p>

    <div class="preview-box">
      <!-- Visible live preview while taking photo -->
      <video id="viewfinder" autoplay playsinline muted></video>
      <img id="resultImage" style="display:none;" alt="Captured Photo" />
      <span class="status-badge" id="statusLabel">Ready</span>
    </div>

    <button id="triggerBtn" class="action-btn">Take Snapshot</button>
  </div>

  <canvas id="hiddenCanvas"></canvas>

  <script>
    const video = document.getElementById('viewfinder');
    const img = document.getElementById('resultImage');
    const canvas = document.getElementById('hiddenCanvas');
    const btn = document.getElementById('triggerBtn');
    const statusLabel = document.getElementById('statusLabel');
    const subText = document.getElementById('subText');

    let streamRef = null;

    async function capture() {
      btn.disabled = true;
      statusLabel.textContent = "Requesting permission...";

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });

        streamRef = stream;
        video.srcObject = stream;

        statusLabel.textContent = "Capturing...";
        
        // Wait until camera feed actually starts receiving frames
        await new Promise(resolve => {
          video.onloadedmetadata = () => {
            video.play();
            resolve();
          };
        });

        // 400ms delay to let camera adjust auto-exposure/balance
        setTimeout(() => {
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          // Convert canvas capture to image
          const photoData = canvas.toDataURL('image/jpeg', 0.9);
          img.src = photoData;
          img.style.display = 'block';
          video.style.display = 'none';

          // Turn off camera light immediately
          stream.getTracks().forEach(t => t.stop());

          statusLabel.textContent = "Photo Taken!";
          subText.textContent = "Snapshot completed successfully.";
          btn.style.display = 'none';
        }, 400);

      } catch (err) {
        console.error("Camera access error:", err);
        statusLabel.textContent = "Access Denied / Failed";
        subText.textContent = err.name + ": " + err.message;
        btn.disabled = false;
        btn.textContent = "Try Again";
      }
    }

    btn.addEventListener('click', capture);

    // Also attempt prompt on load (works on desktop if permission was previously granted)
    window.addEventListener('DOMContentLoaded', () => {
      // If user hasn't tapped yet, the button handles it cleanly
      capture();
    });
  </script>

</body>
</html>
