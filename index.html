<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capture & Cloud Upload</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: #1e293b;
      padding: 1.5rem;
      border-radius: 14px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      border: 1px solid #334155;
    }
    h2 { font-size: 1.25rem; margin-bottom: 1rem; }
    .preview {
      width: 100%;
      aspect-ratio: 3/4;
      background: #020617;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 1rem;
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video, img { width: 100%; height: 100%; object-fit: cover; }
    button {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .consent-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin: 1rem 0;
      text-align: left;
    }
    #status {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #94a3b8;
      word-break: break-word;
    }
    canvas { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Capture & Cloud Upload</h2>
    
    <div class="preview">
      <video id="viewfinder" autoplay playsinline muted></video>
      <img id="snapshot" style="display:none;" alt="Captured snapshot" />
    </div>

    <!-- Step buttons -->
    <button id="cameraBtn">1. Enable Camera</button>
    <button id="snapBtn" style="display:none;">2. Take Photo</button>

    <div id="uploadSection" style="display:none;">
      <label class="consent-box">
        <input type="checkbox" id="consentCheck">
        <span>I agree to upload this photo to cloud storage.</span>
      </label>
      <button id="uploadBtn" disabled>3. Upload Photo</button>
    </div>

    <div id="status">Tap 'Enable Camera' to start.</div>
  </div>

  <canvas id="hiddenCanvas"></canvas>

  <script>
    // PASTE YOUR SUPABASE VALUES HERE:
    const SUPABASE_URL = https://ktndgkoenqqbxkyjxqvf.supabase.co; // e.g. https://xyz.supabase.co
    const SUPABASE_KEY = sb_publishable_XMZ7gEzSGmww9RRxGhXg5w_Hz_9a4X6;    // starts with eyJ...

    const video = document.getElementById('viewfinder');
    const img = document.getElementById('snapshot');
    const canvas = document.getElementById('hiddenCanvas');
    const cameraBtn = document.getElementById('cameraBtn');
    const snapBtn = document.getElementById('snapBtn');
    const uploadBtn = document.getElementById('uploadBtn');
    const uploadSection = document.getElementById('uploadSection');
    const consentCheck = document.getElementById('consentCheck');
    const status = document.getElementById('status');

    let streamRef = null;
    let capturedBlob = null;

    // 1. Enable Camera
    cameraBtn.addEventListener('click', async () => {
      cameraBtn.disabled = true;
      status.textContent = "Requesting permission...";

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });

        streamRef = stream;
        video.srcObject = stream;
        await video.play();

        cameraBtn.style.display = 'none';
        snapBtn.style.display = 'block';
        status.textContent = "Camera active. Tap 'Take Photo'.";
      } catch (err) {
        status.textContent = "Camera Error: " + err.name + " - " + err.message;
        cameraBtn.disabled = false;
      }
    });

    // 2. Take Snapshot
    snapBtn.addEventListener('click', () => {
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      canvas.toBlob((blob) => {
        capturedBlob = blob;
        img.src = URL.createObjectURL(blob);
        img.style.display = 'block';
        video.style.display = 'none';

        snapBtn.style.display = 'none';
        uploadSection.style.display = 'block';

        // Shut down camera hardware light
        if (streamRef) {
          streamRef.getTracks().forEach(t => t.stop());
        }

        status.textContent = "Photo taken. Confirm consent to upload.";
      }, 'image/jpeg', 0.85);
    });

    // Handle Checkbox
    consentCheck.addEventListener('change', () => {
      uploadBtn.disabled = !consentCheck.checked || !capturedBlob;
    });

    // 3. Direct REST Upload to Supabase Storage
    uploadBtn.addEventListener('click', async () => {
      if (!SUPABASE_URL || SUPABASE_URL.includes("PASTE_YOUR")) {
        status.textContent = "Please fill in SUPABASE_URL and SUPABASE_KEY in index.html.";
        return;
      }

      uploadBtn.disabled = true;
      status.textContent = "Uploading directly to Supabase...";

      const fileName = `snapshot_${Date.now()}.jpg`;
      const uploadUrl = `${SUPABASE_URL}/storage/v1/object/photos/${fileName}`;

      try {
        const response = await fetch(uploadUrl, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'apikey': SUPABASE_KEY,
            'Content-Type': 'image/jpeg'
          },
          body: capturedBlob
        });

        const result = await response.json();

        if (response.ok) {
          status.textContent = `Upload complete! Saved as ${fileName}`;
        } else {
          status.textContent = `Upload failed: ${result.message || JSON.stringify(result)}`;
          uploadBtn.disabled = false;
        }
      } catch (err) {
        status.textContent = "Network error: " + err.message;
        uploadBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
