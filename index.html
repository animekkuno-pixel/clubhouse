<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase Snapshot Upload</title>
  <!-- Load Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 1rem; }
    .card { background: #1e293b; padding: 1.5rem; border-radius: 12px; max-width: 360px; width: 100%; text-align: center; }
    .preview { width: 100%; aspect-ratio: 3/4; background: #000; border-radius: 8px; overflow: hidden; margin: 1rem 0; }
    video, img { width: 100%; height: 100%; object-fit: cover; }
    button { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    #status { margin-top: 10px; font-size: 0.85rem; color: #94a3b8; }
    .consent-box { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; margin: 0.75rem 0; text-align: left; }
    canvas { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h3>Capture & Cloud Upload</h3>
    <div class="preview">
      <video id="viewfinder" autoplay playsinline muted></video>
      <img id="snapshot" style="display:none;" />
    </div>

    <button id="cameraBtn">1. Enable Camera</button>
    <button id="snapBtn" style="display:none;">2. Take Photo</button>

    <div id="uploadSection" style="display:none;">
      <label class="consent-box">
        <input type="checkbox" id="consentCheck">
        <span>I agree to upload this photo to cloud storage.</span>
      </label>
      <button id="uploadBtn" disabled>3. Upload Photo</button>
    </div>

    <div id="status">Tap 'Enable Camera' to start.</div>
  </div>

  <canvas id="hiddenCanvas"></canvas>

  <script>
    // 1. CONFIGURATION (Replace with your Supabase credentials)
    const SUPABASE_URL = https://ktndgkoenqqbxkyjxqvf.supabase.co;
    const SUPABASE_KEY = sb_publishable_XMZ7gEzSGmww9RRxGhXg5w_Hz_9a4X6;
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const video = document.getElementById('viewfinder');
    const img = document.getElementById('snapshot');
    const canvas = document.getElementById('hiddenCanvas');
    const cameraBtn = document.getElementById('cameraBtn');
    const snapBtn = document.getElementById('snapBtn');
    const uploadBtn = document.getElementById('uploadBtn');
    const uploadSection = document.getElementById('uploadSection');
    const consentCheck = document.getElementById('consentCheck');
    const status = document.getElementById('status');

    let capturedBlob = null;
    let streamRef = null;

    cameraBtn.addEventListener('click', async () => {
      cameraBtn.disabled = true;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        streamRef = stream;
        video.srcObject = stream;
        cameraBtn.style.display = 'none';
        snapBtn.style.display = 'block';
        status.textContent = "Camera ready. Tap 'Take Photo'.";
      } catch (err) {
        status.textContent = "Camera access denied: " + err.message;
        cameraBtn.disabled = false;
      }
    });

    snapBtn.addEventListener('click', () => {
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(blob => {
        capturedBlob = blob;
        img.src = URL.createObjectURL(blob);
        img.style.display = 'block';
        video.style.display = 'none';
        snapBtn.style.display = 'none';
        uploadSection.style.display = 'block';

        if (streamRef) streamRef.getTracks().forEach(t => t.stop());
        status.textContent = "Check consent to upload.";
      }, 'image/jpeg', 0.85);
    });

    consentCheck.addEventListener('change', () => {
      uploadBtn.disabled = !consentCheck.checked || !capturedBlob;
    });

    uploadBtn.addEventListener('click', async () => {
      uploadBtn.disabled = true;
      status.textContent = "Uploading to Supabase Storage...";

      const fileName = `snapshot_${Date.now()}.jpg`;

      // Upload directly into the 'photos' bucket
      const { data, error } = await supabase.storage
        .from('photos')
        .upload(fileName, capturedBlob, {
          contentType: 'image/jpeg'
        });

      if (error) {
        status.textContent = "Upload failed: " + error.message;
        uploadBtn.disabled = false;
      } else {
        status.textContent = `Uploaded successfully as: ${fileName}`;
      }
    });
  </script>
</body>
</html>
