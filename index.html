<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Photo Capture</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
    }
    h1 { font-size: 1.25rem; margin-bottom: 0.5rem; text-align: center; }
    p.sub { font-size: 0.85rem; color: #94a3b8; margin-bottom: 1rem; text-align: center; }
    .display-area {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 3/4;
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video, img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Hidden elements used for processing */
    video { display: none; }
    canvas { display: none; }

    .status-text {
      position: absolute;
      bottom: 12px;
      background: rgba(15, 23, 42, 0.8);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
    }
    #fallbackBtn {
      display: none;
      margin-top: 1rem;
      padding: 12px 24px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Auto Capture Verification</h1>
  <p class="sub">Grant camera permission to capture snapshot</p>

  <div class="display-area">
    <!-- Camera stream runs silently in background -->
    <video id="videoFeed" playsinline autoplay muted></video>
    
    <!-- Rendered image output -->
    <img id="photoOutput" alt="Photo will appear here after capture" />
    
    <div class="status-text" id="statusMsg">Requesting permission...</div>
  </div>

  <canvas id="snapshotCanvas"></canvas>

  <!-- Fallback button if mobile OS blocks page-load requests -->
  <button id="fallbackBtn">Tap to Allow Camera</button>

  <script>
    const video = document.getElementById('videoFeed');
    const canvas = document.getElementById('snapshotCanvas');
    const photoOutput = document.getElementById('photoOutput');
    const statusMsg = document.getElementById('statusMsg');
    const fallbackBtn = document.getElementById('fallbackBtn');

    let streamCaptured = false;

    async function startCameraAndCapture() {
      try {
        statusMsg.textContent = "Waiting for permission...";
        
        // Request camera feed immediately
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" }, // Use "environment" for back camera
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        statusMsg.textContent = "Focusing camera...";

        // Wait 600ms so camera hardware adjusts brightness/exposure before capture
        setTimeout(() => {
          capturePhoto(stream);
        }, 600);

      } catch (err) {
        console.error("Camera access failed:", err);
        statusMsg.textContent = "Permission blocked or failed.";
        fallbackBtn.style.display = "block";
      }
    }

    function capturePhoto(stream) {
      if (streamCaptured) return;
      streamCaptured = true;

      // Match canvas resolution to actual video feed dimensions
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Convert frame to base64 image and display
      const imageData = canvas.toDataURL('image/jpeg', 0.9);
      photoOutput.src = imageData;

      // Shut down camera hardware indicator light immediately
      stream.getTracks().forEach(track => track.stop());

      statusMsg.textContent = "Photo captured!";
      fallbackBtn.style.display = "none";
    }

    fallbackBtn.addEventListener('click', () => {
      fallbackBtn.style.display = "none";
      startCameraAndCapture();
    });

    // Run immediately when page loads
    window.addEventListener('DOMContentLoaded', () => {
